name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A tag calls this once and then publishes what it built.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            artifact: pokem-online-linux-x86_64
          - os: windows-latest
            name: windows-x86_64
            artifact: pokem-online-windows-x86_64
          - os: macos-latest
            name: macos
            artifact: pokem-online-macos

    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true

      # CEF's wrapper is built by its own CMake project with Ninja.
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      # CMake needs cl.exe on PATH; cargo finds the linker on its own.
      - name: Build tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: cargo build --release --locked

      # CEF asks Windows which version it is on before it starts the GPU process, and
      # answers from the executable's manifest. rustc embeds none, so the shipped exe
      # had no answer, the GPU process died on start, and some players could only run
      # it with --in-process-gpu. mt.exe puts the manifest in, and reading it back
      # proves it landed instead of trusting an exit code.
      - name: Manifest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mt = (Get-Command mt.exe -ErrorAction SilentlyContinue).Source
          if (-not $mt) {
            $mt = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mt.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -match '\\x64$' } | Select-Object -First 1).FullName
          }
          if (-not $mt) { throw "mt.exe not found" }

          & $mt -nologo -manifest packaging/windows/app.manifest "-outputresource:target/release/pokem-online.exe;#1"
          if ($LASTEXITCODE -ne 0) { throw "mt.exe could not embed the manifest" }

          & $mt -nologo "-inputresource:target/release/pokem-online.exe;#1" -out:target/release/embedded.manifest
          if ($LASTEXITCODE -ne 0) { throw "the executable has no manifest" }
          $xml = Get-Content target/release/embedded.manifest -Raw
          foreach ($guid in @("8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a", "1f676c76-80e1-4239-95bb-83d0f6d0da78")) {
            if (-not $xml.Contains($guid)) { throw "manifest is missing $guid" }
          }
          Write-Host "manifest embedded and checked"

      # The CEF download ships an unstripped libcef.so on Linux: 1.4 GB here against
      # the 277 MB a stripped one takes. Debug symbols are not used at runtime, and
      # every distro package of CEF is stripped, so strip it before it is packaged.
      - name: Strip CEF (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          for so in target/release/libcef.so $(find target/release/build -name 'libcef.so' -print); do
            if [ ! -e "$so" ]; then continue; fi
            before="$(stat -c %s "$so")"
            strip --strip-unneeded "$so"
            echo "$so: $before -> $(stat -c %s "$so") bytes"
          done

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          pkg=dist/${{ matrix.artifact }}
          mkdir -p "$pkg"
          cp target/release/pokem-online "$pkg/"
          cp -r assets "$pkg/"

          # The runtime lives in the CEF directory cef-dll-sys resolved, which is
          # not always next to the binary. Copy from there and fail loudly if it
          # cannot be found.
          cef_so="$(find target/release/build -name libcef.so -print -quit)"
          if [ -z "$cef_so" ]; then
            echo "CEF runtime not found. target/release contains:" >&2
            ls -la target/release >&2
            find target/release/build -maxdepth 2 -type d >&2
            exit 1
          fi
          cef_dir="$(dirname "$cef_so")"
          echo "CEF runtime: $cef_dir"
          cp "$cef_dir"/*.so "$pkg/" || true
          cp "$cef_dir"/*.so.* "$pkg/" || true
          cp "$cef_dir"/*.pak "$cef_dir"/*.dat "$cef_dir"/*.bin "$cef_dir"/*.json "$pkg/" || true
          cp "$cef_dir/chrome-sandbox" "$pkg/"
          cp -r "$cef_dir/locales" "$pkg/"
          tar -C dist -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      # The AppImage is the format most Linux players want, so it is built here too and
      # released without anyone having to upload 148 MB from their own machine.
      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          # appimagetool is itself an AppImage, and a runner has no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -eu
          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$tool"
          APPIMAGETOOL="$tool" ./packaging/appimage/build.sh dist
          ls -lh dist/*.AppImage

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item target/release/pokem-online.exe $pkg
          Copy-Item -Recurse assets $pkg

          $cef = Get-ChildItem -Path target/release/build -Recurse -Filter libcef.dll |
            Select-Object -First 1
          if (-not $cef) { throw "CEF runtime not found under target/release/build" }
          $src = $cef.Directory.FullName
          Write-Host "CEF runtime: $src"
          Copy-Item "$src/*.dll" $pkg
          Copy-Item "$src/*.pak" $pkg
          Copy-Item "$src/*.dat" $pkg
          Copy-Item "$src/*.bin" $pkg
          Copy-Item "$src/*.json" $pkg
          Copy-Item -Recurse "$src/locales" $pkg
          Copy-Item -Recurse "$src/swiftshader" $pkg -ErrorAction SilentlyContinue
          Compress-Archive -Path $pkg -DestinationPath "${{ matrix.artifact }}.zip"

      # A bare Mach-O cannot find the framework, so wrap it in an app bundle.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          ./target/release/bundle-macos release dist
          app="$(ls -d dist/*.app | head -1)"
          cp -r assets "$app/Contents/assets"
          ditto -c -k --sequesterRsrc --keepParent "$app" ${{ matrix.artifact }}.zip

      - name: Verify package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar tzf ${{ matrix.artifact }}.tar.gz > /tmp/files.txt
          grep -q '/libcef.so$' /tmp/files.txt
          grep -q '/locales/en-US.pak$' /tmp/files.txt
          grep -q '/assets/splash/index.html$' /tmp/files.txt
          echo "Linux package has the runtime and assets"

      # Extracting needs no FUSE, and it proves the mount really holds the runtime
      # rather than a binary that would die on the player's machine.
      - name: Verify the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          img=dist/pokem-online-x86_64.AppImage
          test -x "$img"
          for path in usr/bin/libcef.so usr/bin/assets/splash/index.html pokem-online.desktop; do
            "$img" --appimage-extract "$path" > /dev/null
            test -s "squashfs-root/$path"
            echo "AppImage has $path"
          done
          rm -rf squashfs-root

      - name: Verify package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("${{ matrix.artifact }}.zip")
          $names = $zip.Entries | ForEach-Object { $_.FullName }
          $zip.Dispose()
          foreach ($needle in @("libcef.dll", "locales/en-US.pak", "assets/splash/index.html")) {
            if (-not ($names -match [regex]::Escape($needle))) {
              throw "missing $needle in the Windows package"
            }
          }
          Write-Host "Windows package has the runtime and assets"

      - name: Verify package (macOS)
        if: runner.os == 'macOS'
        run: |
          unzip -l ${{ matrix.artifact }}.zip > /tmp/files.txt
          grep -q 'Chromium Embedded Framework.framework/Chromium Embedded Framework$' /tmp/files.txt
          grep -q 'Contents/assets/splash/index.html$' /tmp/files.txt
          echo "macOS bundle has the framework and assets"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
            dist/*.AppImage
          if-no-files-found: error
