name: Release

# Push a tag and the same matrix builds, then everything it produced is attached to a
# GitHub release. Nothing here builds a second time.
on:
  push:
    tags:
      - "v*"
  # Publishing an existing tag again is how a release picks up an asset that a later
  # change to the build added, without inventing a version number for it.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Each artifact lands in dist/<artifact name>/<archive>.
      - name: Collect the builds
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List what will be attached
        run: find dist -type f | sort

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "publishing $TAG"
          assets="dist/*/*.tar.gz dist/*/*.zip dist/*/*.AppImage"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" $assets --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Pokem Online $TAG" \
              --generate-notes \
              $assets
          fi
